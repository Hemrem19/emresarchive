name = "citavers-backend"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

# Serve the API on the same site as the frontend so the refresh-token
# cookie is first-party. The workers.dev address is off so the API has one
# public origin.
workers_dev = false
routes = [
  { pattern = "api.citavers.com", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"
# Cloud storage per library (e.g. "2GB", "500MB"); placeholder for now
STORAGE_LIMIT = "2GB"
# Nightly cleanup of expired-trash and unreferenced PDFs (src/services/purge.js):
# "report" only logs what would be removed; "delete" removes it
STORAGE_PURGE = "report"
# [env.production]
# name = "citavers-backend-prod"

[triggers]
crons = ["0 3 * * *"] # 03:00 UTC daily: storage purge

[[d1_databases]]
binding = "citavers_db"
database_name = "citavers-db"
database_id = "5b21fd57-2739-41a6-af6e-119daefed72a"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "citaversa-pdfs"

[durable_objects]
bindings = [
  { name = "WORKSPACE_DO", class_name = "WorkspaceDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDurableObject"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1