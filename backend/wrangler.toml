name = "citavers-backend"
main = "src/worker.js"
compatibility_date = "2024-03-20"
node_compat = true

# [env.production]
# name = "citavers-backend-prod"

[[d1_databases]]
binding = "DB"
database_name = "citavers-db"
database_id = "YOUR_DATABASE_ID_HERE"

[durable_objects]
bindings = [
  { name = "WORKSPACE_DO", class_name = "WorkspaceDurableObject" }
]

[[migrations]]
tag = "v1"
new_classes = ["WorkspaceDurableObject"]
